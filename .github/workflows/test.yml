name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    # Intel runners are free of the Apple-silicon queue; audit and style don't depend on the CPU.
    runs-on: macos-15-intel
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      # The formula picks a prebuilt binary per OS (url inside on_macos/on_linux). That works,
      # but homebrew-core's style only allows it in resources, so that one cop is skipped.
      - run: brew style --except-cops=FormulaAudit/ComponentsOrder akevdev/tap
      - run: brew audit --strict --online --skip-style --tap akevdev/tap

  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install akevdev/tap/akev
      - run: brew test akevdev/tap/akev
      - run: akev --version
      - run: brew uninstall akevdev/tap/akev

  cask:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install --cask akevdev/tap/akev-desktop
      - run: ls -la /Applications/Akev.app/Contents/MacOS/
      - run: codesign -dv /Applications/Akev.app 2>&1 | head -5 || true
      - run: brew uninstall --cask akevdev/tap/akev-desktop
      - run: test ! -e /Applications/Akev.app
