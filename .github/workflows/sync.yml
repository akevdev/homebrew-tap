name: sync

# Copies the formula and cask from the latest Akev release's packaging.zip (rendered by
# scripts/package-manifests.sh in the release workflow), after checking that zip against the
# release's Sigstore-signed SHA256SUMS. Runs every 6 hours and on demand.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Update from the latest release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/akevdev/akev/releases/latest --jq .tag_name)
          version=${tag#v}
          current=$(sed -n 's|.*/releases/download/v\([^/"]*\)/.*|\1|p' Formula/akev.rb | head -1)
          if [ "$version" = "$current" ]; then
            echo "Already at $version."
            exit 0
          fi
          work=$(mktemp -d)
          gh release download "$tag" -R akevdev/akev -D "$work" \
            -p "akev-$version-packaging.zip" -p SHA256SUMS -p SHA256SUMS.sigstore.json
          cd "$work"
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp '^https://github.com/akevdev/akev/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          grep " akev-$version-packaging.zip\$" SHA256SUMS | sha256sum -c -
          unzip -q "akev-$version-packaging.zip" -d rendered
          cd "$GITHUB_WORKSPACE"
          cp "$work/rendered/homebrew/akev.rb" Formula/akev.rb
          cp "$work/rendered/homebrew/akev-desktop.rb" Casks/akev-desktop.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          git commit -m "akev $version"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Test the update
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
